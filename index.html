<!DOCTYPE html>
<html>
<head>
    <title>My To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>My To-Do List</h1>

        <div class="input-area">
            <input 
                id="taskInput" 
                type="text" 
                placeholder="Type a task..."
            >

            <button id="addTaskBtn">Add Task</button>
        </div>

        <p id="taskCount">Tasks: 0</p>

        <ul id="taskList"></ul>

    </div>

    <script src="script.js"></script>

</body>
</html>
